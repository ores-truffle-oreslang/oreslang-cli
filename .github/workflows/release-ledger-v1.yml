name: Public single-host transactional release ledger (NON-AUTHORIZING)
on:
  pull_request:
    paths:
      - 'tools/release-ledger-v1/**'
      - 'tests/release-ledger-v1.test.mjs'
      - '.github/workflows/release-ledger-v1.yml'
      - 'docs/RELEASE_LEDGER_V1.md'
      - 'tools/release-checkpoint-v1/**'
      - 'tools/release-trust-registry-v1/**'
      - 'tools/release-assurance-v1/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local-sqlite-cas-and-crash-safety:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Checkout immutable original PR head, no persisted token
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify original PR head, tree and physical file blobs
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_HEAD" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse --verify 'HEAD^{commit}')" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain --untracked-files=all)"
          test -z "$(git ls-files --others --ignored --exclude-standard)"
          for p in tools/release-ledger-v1/sqlite-ledger.mjs tools/release-ledger-v1/claim.mjs tests/release-ledger-v1.test.mjs .github/workflows/release-ledger-v1.yml docs/RELEASE_LEDGER_V1.md tools/release-checkpoint-v1/verify.mjs tests/release-checkpoint-v1.test.mjs tools/release-trust-registry-v1/verify.mjs tests/release-trust-registry-v1.test.mjs tools/release-assurance-v1/verify.mjs tests/release-assurance-v1.test.mjs; do
            sha="$(git rev-parse "HEAD:$p")"
            test "$(git hash-object --no-filters "$p")" = "$sha"
            echo "EXACT_SOURCE_BLOB $p $sha"
          done
          echo "EXACT_HEAD=$EXPECTED_HEAD"
          echo "EXACT_TREE=$(git rev-parse 'HEAD^{tree}')"
      - name: Install pinned Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.20.0'
      - name: Run signed chain, atomic CAS, multi-process and crash recovery tests
        shell: bash
        run: |
          set -euo pipefail
          node --version
          node --check tools/release-ledger-v1/sqlite-ledger.mjs
          node --check tools/release-ledger-v1/claim.mjs
          node --check tests/release-ledger-v1.test.mjs
          node --test tests/release-assurance-v1.test.mjs tests/release-trust-registry-v1.test.mjs tests/release-checkpoint-v1.test.mjs tests/release-ledger-v1.test.mjs | tee "$RUNNER_TEMP/atto-ledger-test.tap"
          node --input-type=module - "$RUNNER_TEMP/atto-ledger-test.tap" <<'NODE'
          import { readFileSync } from 'node:fs';
          const rows=readFileSync(process.argv[2],'utf8').split(/\r?\n/);
          const count=name=>{
            const prefix='# '+name+' ';
            const hits=rows.filter(x=>x.startsWith(prefix));
            if(hits.length!==1||!/^[0-9]+$/.test(hits[0].slice(prefix.length)))
              throw Error('MALFORMED_OR_MISSING_TAP_'+name);
            return Number(hits[0].slice(prefix.length));
          };
          const total=count('tests'),pass=count('pass'),fail=count('fail');
          const skipped=count('skipped'),cancelled=count('cancelled');
          if(total<300||pass!==total||fail!==0||skipped!==0||cancelled!==0)
            throw Error('LEDGER_TESTS_INSUFFICIENT_OR_NOT_EXECUTED');
          console.log('ATTO_LEDGER_NATIVE_NODE_PASS='+total);
          NODE
          echo "LOCAL_SINGLE_HOST_CAS_ONLY: release_authorized=false; no trusted publisher, remote ledger, live GitHub proof, guest parity or secure clock"
