name: Public TLC reviewer and merge-race safety v2
on:
  pull_request:
    paths:
      - 'specs/MergeAssuranceReviewerRaceV2.tla'
      - 'specs/merge-assurance-reviewer-race-v2.*.cfg'
      - '.github/workflows/merge-assurance-reviewer-race-v2.yml'
      - 'docs/MERGE_ASSURANCE_REVIEWER_RACE_V2.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-free-tlc-review-race-v2:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout exact original PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify original checkout identity and source hashes
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_HEAD" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse --verify 'HEAD^{commit}')" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain --untracked-files=all)"
          echo "SOURCE_HEAD=$EXPECTED_HEAD"
          echo "SOURCE_TREE=$(git rev-parse 'HEAD^{tree}')"
          sha256sum specs/MergeAssuranceReviewerRaceV2.tla specs/merge-assurance-reviewer-race-v2.*.cfg
      - name: Authenticate pinned public TLC distribution
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tlc-race-logs
          curl --fail --location --silent --show-error --retry 3 \
            'https://github.com/zactionsz/tla-tools/releases/download/tla2tools-2026.08.11.125311/tla2tools.jar' \
            --output /tmp/atto-public-review-race-tlc.jar
          printf '%s  %s\n' 'ab323b79802aedc3203b3f9af37c6aca3ed43f4e0225b36f2aa77b26de46c05f' '/tmp/atto-public-review-race-tlc.jar' | sha256sum --check
          java -version
      - name: TLC verify independent-review and atomic-current-head merge safety
        shell: bash
        run: |
          set -euo pipefail
          java -cp /tmp/atto-public-review-race-tlc.jar tlc2.TLC -workers 1 \
            -config specs/merge-assurance-reviewer-race-v2.safe.cfg \
            specs/MergeAssuranceReviewerRaceV2.tla | tee tlc-race-logs/safe.log
          grep -q 'Model checking completed. No error has been found.' tlc-race-logs/safe.log
      - name: TLC kill three unsafe reviewer and preflight variants
        shell: bash
        run: |
          set -euo pipefail
          for mutant in self-review stale-snapshot revoked-review; do
            echo "Checking expected unsafe mutation: $mutant"
            if timeout 120s java -cp /tmp/atto-public-review-race-tlc.jar tlc2.TLC -workers 1 \
              -config "specs/merge-assurance-reviewer-race-v2.$mutant.cfg" \
              specs/MergeAssuranceReviewerRaceV2.tla \
              >"tlc-race-logs/$mutant.log" 2>&1; then
              echo "UNSAFE MUTANT PASSED: $mutant" >&2
              exit 1
            fi
            grep -q 'Invariant NoUnsafeMerge is violated' "tlc-race-logs/$mutant.log" || {
              cat "tlc-race-logs/$mutant.log"
              echo "Wrong failure or parser error: $mutant" >&2
              exit 1
            }
            grep -m1 'Invariant NoUnsafeMerge is violated' "tlc-race-logs/$mutant.log"
          done
      - name: Upload public TLC review-race logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: source-free-review-race-v2-${{ github.event.pull_request.head.sha || github.sha }}
          path: tlc-race-logs/
          if-no-files-found: warn
          retention-days: 14
