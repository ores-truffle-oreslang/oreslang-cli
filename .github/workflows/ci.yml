name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable snapshot 2026-10-14
        with:
          toolchain: 1.78.0
          components: rustfmt
      - name: Format
        run: cargo fmt --all --check
      - name: Test
        run: cargo test --workspace --locked
      - name: Smoke test public CLI
        run: |
          cargo run --locked -- version
          cargo run --locked -- doctor
      - name: Verify Homebrew formula generator syntax and checksums contract
        shell: bash
        run: |
          set -euo pipefail
          bash -n packaging/homebrew/generate-formula.sh
          command -v ruby
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          sha_a="$(printf 'a%.0s' {1..64})"
          sha_b="$(printf 'b%.0s' {1..64})"
          bash packaging/homebrew/generate-formula.sh v0.1.0 "$sha_a" "$sha_b" "$tmp/oreslang.rb"
          ruby -c "$tmp/oreslang.rb"
          grep -q "oreslang-compiler-macos-arm64.tar.gz" "$tmp/oreslang.rb"
          grep -q "oreslang-compiler-macos-x86_64.tar.gz" "$tmp/oreslang.rb"
          if bash packaging/homebrew/generate-formula.sh v0.1.0 NOT_A_SHA "$sha_b" "$tmp/bad.rb"; then
            echo "generator accepted invalid SHA-256" >&2
            exit 1
          fi
