name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable snapshot 2026-10-14
        with:
          toolchain: 1.78.0
          components: rustfmt
      - name: Format
        run: cargo fmt --all --check
      - name: Test
        run: cargo test --workspace --locked
      - name: Smoke test public CLI
        run: |
          cargo run --locked -- version
          cargo run --locked -- doctor
