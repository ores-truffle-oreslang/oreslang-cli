name: Release binaries

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: oreslang-linux-x86_64.tar.gz
            binary: oreslang
          - os: macos-13
            target: x86_64-apple-darwin
            archive: oreslang-macos-x86_64.tar.gz
            binary: oreslang
          - os: macos-14
            target: aarch64-apple-darwin
            archive: oreslang-macos-aarch64.tar.gz
            binary: oreslang
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: oreslang-windows-x86_64.zip
            binary: oreslang.exe

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # pinned v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # pinned
        with:
          toolchain: 1.78.0
          targets: ${{ matrix.target }}

      - name: Test workspace
        run: cargo test --workspace --locked

      - name: Build release binary
        run: cargo build --release --locked --bins --target ${{ matrix.target }}

      - name: Package Unix binary
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" dist/
          cp "target/${{ matrix.target }}/release/atto" dist/
          tar -C dist -czf "${{ matrix.archive }}" "${{ matrix.binary }}" atto

      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.binary }}" "dist/${{ matrix.binary }}"
          Copy-Item "target/${{ matrix.target }}/release/atto.exe" "dist/atto.exe"
          Compress-Archive -Path "dist/*.exe" -DestinationPath "${{ matrix.archive }}"

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # pinned v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}

      - name: Upload GitHub release asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.ref_name }}" "${{ matrix.archive }}" --clobber
