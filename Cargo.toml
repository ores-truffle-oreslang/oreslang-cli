[workspace]
members = [
  "crates/oreslang-cli",
  "crates/oreslang-compiler-client",
  "crates/oreslang-protocol",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.78"

[workspace.dependencies]
clap = { version = "=4.5.48", features = ["derive"] }
regex = "=1.11.2"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
