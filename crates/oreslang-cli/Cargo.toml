[package]
name = "oreslang-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# Both commands are built from the same implementation and share all permissions,
# protocol behavior, compiler discovery and exit statuses.
[[bin]]
name = "oreslang"
path = "src/main.rs"

[[bin]]
name = "atto"
path = "src/main.rs"

[dependencies]
clap.workspace = true
oreslang-compiler-client = { path = "../oreslang-compiler-client" }
oreslang-lsp = { path = "../oreslang-lsp" }
oreslang-protocol = { path = "../oreslang-protocol" }
serde.workspace = true
serde_json.workspace = true
